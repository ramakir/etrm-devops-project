spring:
  application:
    name: trade-service

  datasource:
    url: jdbc:aws-wrapper:postgresql://etrm-dev-postgres.cpuu2a8kw525.ap-south-1.rds.amazonaws.com:5432/etrm?options=-c%20TimeZone=UTC
    username: etrmapp
    password: ""
    driver-class-name: software.amazon.jdbc.Driver

    hikari:
      data-source-properties:
        wrapperPlugins: iam

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      probes:
        enabled: true